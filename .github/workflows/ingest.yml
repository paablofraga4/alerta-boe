name: Ingesta diaria del BOE

# Sustituye al worker de pago: corre la ingesta+enriquecido+alertas una vez al
# día (y a demanda) contra Supabase. Gratis en GitHub Actions.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC cada día (el BOE ya está publicado)
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a ingerir (AAAA-MM-DD). Vacío = hoy."
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolver fecha
        id: fecha
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            D="${{ github.event.inputs.fecha }}"
          else
            D="$(date -u +%Y-%m-%d)"
          fi
          echo "iso=$D" >> "$GITHUB_OUTPUT"
          echo "compact=$(echo $D | tr -d -)" >> "$GITHUB_OUTPUT"
      - name: Ingerir y enriquecer el BOE
        run: boe ingest "${{ steps.fecha.outputs.compact }}"
      - name: Enviar alertas casadas
        run: boe alerts-run "${{ steps.fecha.outputs.iso }}"
      - name: Backfill de resúmenes al agente v2 (por lotes)
        # Auto-cura: cada día regenera un lote de resúmenes antiguos al brief
        # estructurado, hasta que todo el histórico sea v2 (puebla el Radar).
        run: boe resummarize --limit 200
        continue-on-error: true
      - name: Generar borradores de contenido para redes
        # Genera guiones (TikTok/LinkedIn/X) de las 3 publicaciones mas
        # interesantes del dia. Quedan como BORRADOR en /contenido; nada se
        # publica sin aprobacion. El render de video lo hace render-videos.yml.
        run: boe content-generate "${{ steps.fecha.outputs.iso }}" --top 3
        continue-on-error: true
