# Blueprint de Render para la API de AlertaBOE (plan gratuito).
#
# La web va en Vercel, la base de datos en Supabase y la INGESTA DIARIA en un
# cron de GitHub Actions (.github/workflows/ingest.yml) — así todo es gratis:
# Render no tiene plan gratis para workers, pero sí para servicios web.
#
# Uso: Render → New → Blueprint → apuntar a este repo. Rellenar los secretos
# marcados como sync:false.
services:
  # API pública (FastAPI). Aplica migraciones al arrancar. Plan free.
  - type: web
    name: alertaboe-api
    runtime: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false   # postgresql+asyncpg://postgres.<ref>:<pass>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: API_CORS_ORIGINS
        sync: false   # https://<tu-web>.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false   # backup del LLM (LLM_FALLBACK_PROVIDER=openai por defecto)
      - key: API_KEYS
        sync: false   # opcional: protege /v1 con X-API-Key

