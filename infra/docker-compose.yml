services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alertaboe
      POSTGRES_PASSWORD: alertaboe
      POSTGRES_DB: alertaboe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertaboe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://alertaboe:alertaboe@db:5432/alertaboe
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Aplica migraciones antes de arrancar la API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://alertaboe:alertaboe@db:5432/alertaboe
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      # SSR habla con la API por la red interna; el navegador, por localhost.
      API_BASE: http://api:8000
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
