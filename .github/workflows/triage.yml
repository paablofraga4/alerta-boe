name: Triaje editorial (backfill de categorías)

# Recalcula categoría y relevancia de TODOS los documentos (determinista, sin
# LLM: segundos). Independiente de la ingesta diaria, para poder repoblar la
# portada por categorías sin esperar a los resúmenes.
on:
  workflow_dispatch: {}

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Recalcular categoría y relevancia
        run: boe triage-backfill
