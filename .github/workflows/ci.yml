name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alertaboe
          POSTGRES_PASSWORD: alertaboe
          POSTGRES_DB: alertaboe_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U alertaboe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Con DB disponible, los tests de integración del pipeline se ejecutan
      # (si no la hubiera, se saltarían solos).
      DATABASE_URL: postgresql+asyncpg://alertaboe:alertaboe@localhost:5432/alertaboe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check boe apps workers tests
      - name: Pytest
        run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alertaboe
          POSTGRES_PASSWORD: alertaboe
          POSTGRES_DB: alertaboe
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U alertaboe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://alertaboe:alertaboe@localhost:5432/alertaboe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Aplicar migraciones (crea pgvector + esquema)
        run: alembic upgrade head
      - name: Verificar que downgrade funciona
        run: alembic downgrade base
