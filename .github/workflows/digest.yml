name: Digest semanal (El BOE en 3 minutos)

# Envía la newsletter semanal a cada suscripción activa con las novedades de su
# semana y los plazos aún abiertos. Viernes por la mañana, tras la ingesta.
on:
  schedule:
    - cron: "30 8 * * 5"   # viernes 08:30 UTC
  workflow_dispatch:
    inputs:
      hasta:
        description: "Último día de la semana (AAAA-MM-DD). Vacío = hoy."
        required: false
        default: ""

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Enviar digest semanal
        run: |
          if [ -n "${{ github.event.inputs.hasta }}" ]; then
            boe digest-weekly --hasta "${{ github.event.inputs.hasta }}"
          else
            boe digest-weekly
          fi
